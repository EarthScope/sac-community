name: Build and Release
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Trigger on manual run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} build
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm
            runs-on: macos-latest
          - name: macos-x86_64
            runs-on: macos-15-intel
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            container: almalinux:8   # glibc 2.28 → runs on essentially anything from ~2018 on
          - name: linux-arm
            runs-on: ubuntu-24.04-arm
            container: arm64v8/alpine:3.21   # glibc 2.38 → runs on arm64 from ~2023 on
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^AC_INIT(\[[^]]*\],\[\([^]]*\)\],.*/\1/p' configure.ac)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag ${TAG#v} does not match configure.ac version $version"
            exit 1
          fi
          config/set-version --check
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxpm-dev libx11-dev libcurl4-openssl-dev xvfb
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          echo "PKG_CONFIG_PATH=/opt/X11/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CONFIGURE_X_FLAGS=--x-includes=/opt/X11/include --x-libraries=/opt/X11/lib" >> "$GITHUB_ENV"
          echo "CONFIGURE_CURL_FLAGS=--with-libcurl=/usr" >> "$GITHUB_ENV"
      - name: Create Build directory
        run: mkdir build
      - name: Configure
        working-directory: ./build
        run: ../configure $CONFIGURE_X_FLAGS $CONFIGURE_CURL_FLAGS
      - name: Compile
        working-directory: ./build
        run: make
      - name: Verify macOS library linkage
        if: runner.os == 'macOS'
        working-directory: ./build
        run: |
          otool -L src/sac
          if ! otool -L src/sac | grep -qE '^[[:space:]]+/opt/X11/lib/libX11\.'; then
            echo "::error::sac is not linked against XQuartz libX11"
            exit 1
          fi
          if ! otool -L src/sac | grep -qE '^[[:space:]]+/usr/lib/libcurl\.'; then
            echo "::error::sac is not linked against the system libcurl"
            exit 1
          fi
          if otool -L src/sac | grep -qE '/opt/homebrew/|/usr/local/(opt|Cellar)/'; then
            echo "::error::sac links Homebrew libraries"
            exit 1
          fi
      - name: Test
        timeout-minutes: 10
        if: runner.os == 'Linux'
        working-directory: ./build
        run: xvfb-run -a make check
      - name: Show test log
        if: failure() && runner.os == 'Linux'
        working-directory: ./build
        run: cat t/test-suite.log || true
      - name: Distributions
        working-directory: ./build
        run: make dist-binary
      - name: Name distribution tarball
        id: dist
        env:
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -eu
          pkg=$(awk  -F ' = ' '$1 == "PACKAGE"     { print $2; exit }' build/Makefile)
          ver=$(awk  -F ' = ' '$1 == "VERSION"     { print $2; exit }' build/Makefile)
          dist=$(awk -F ' = ' '$1 == "BINARY_DIST" { print $2; exit }' build/Makefile)
          if [ -z "$pkg" ] || [ -z "$ver" ] || [ -z "$dist" ]; then
            echo "::error::could not read PACKAGE/VERSION/BINARY_DIST from build/Makefile"
            exit 1
          fi

          built="build/$pkg-$ver-$dist.tar.gz"
          if [ ! -f "$built" ]; then
            echo "::error::make dist-binary did not produce $pkg-$ver-$dist.tar.gz"
            ls -l build/*.tar.gz || true
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "refs/tags/v$ver:refs/tags/v$ver" 2>/dev/null || true
          tagged=$(git rev-parse -q --verify "refs/tags/v$ver^{commit}" || true)

          if [ -n "$tagged" ] && [ "$tagged" = "$(git rev-parse HEAD^{commit})" ]; then
            name="$pkg-$ver-$PLATFORM.tar.gz"
          else
            name="$pkg-$ver+$(git rev-parse --short=8 HEAD)-$PLATFORM.tar.gz"
          fi

          mv -- "$built" "build/$name"
          echo "path=build/$name" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the tarball as-is, with no enclosing zip.
          # The artifact name is taken from the file; the name input is ignored.
          path: ${{ steps.dist.outputs.path }}
          archive: false
          if-no-files-found: error
      - name: Done
        run: echo "Status ${{ job.status }}"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            License
            CHANGES
            README.md
            dist/sac-*.tar.gz
