name: Build and Release
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Trigger on manual run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} build
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm
            runs-on: macos-latest
          - name: macos-x86_64
            runs-on: macos-15-intel
          - name: linux-x86_64
            runs-on: ubuntu-24.04
          # - name: linux-arm
          #   runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^AC_INIT(\[[^]]*\],\[\([^]]*\)\],.*/\1/p' configure.ac)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag ${TAG#v} does not match configure.ac version $version"
            exit 1
          fi
          config/set-version --check
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxpm-dev libx11-dev libcurl4-openssl-dev xvfb
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libxml2 curl libxpm libx11
      - name: Create Build directory
        run: mkdir build
      - name: Configure
        working-directory: ./build
        run: ../configure --enable-editline
      - name: Compile
        working-directory: ./build
        run: make
      - name: Test
        if: runner.os == 'Linux'
        working-directory: ./build
        run: xvfb-run -a make check
      - name: Show test log
        if: failure() && runner.os == 'Linux'
        working-directory: ./build
        run: cat t/test-suite.log || true
      - name: Distributions
        working-directory: ./build
        run: make dist-binary
      - name: Name distribution tarball
        id: dist
        run: |
          set -eu
          pkg=$(awk -F ' = ' '$1 == "PACKAGE"     { print $2; exit }' build/Makefile)
          ver=$(awk -F ' = ' '$1 == "VERSION"     { print $2; exit }' build/Makefile)
          plat=$(awk -F ' = ' '$1 == "BINARY_DIST" { print $2; exit }' build/Makefile)
          if [ -z "$pkg" ] || [ -z "$ver" ] || [ -z "$plat" ]; then
            echo "::error::could not read PACKAGE/VERSION/BINARY_DIST from build/Makefile"
            exit 1
          fi

          name="$pkg-$ver-$plat.tar.gz"
          if [ ! -f "build/$name" ]; then
            echo "::error::make dist-binary did not produce $name"
            ls -l build/*.tar.gz || true
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" != tag ]; then
            renamed="$pkg-$ver-g$(git rev-parse --short=8 HEAD)-$plat.tar.gz"
            mv -- "build/$name" "build/$renamed"
            name="$renamed"
          fi

          echo "path=build/$name" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the tarball as-is, with no enclosing zip.
          # The artifact name is taken from the file; the name input is ignored.
          path: ${{ steps.dist.outputs.path }}
          archive: false
          if-no-files-found: error
      - name: Done
        run: echo "Status ${{ job.status }}"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            License
            CHANGES
            README.md
            dist/sac-*.tar.gz
